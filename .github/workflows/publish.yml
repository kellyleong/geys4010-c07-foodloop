name: Publish FoodLoop and sync official statistics

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 22 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Sync official annual statistics and collection-point counts
        run: python3 scripts/update-food-waste.py
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
